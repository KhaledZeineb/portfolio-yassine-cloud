services:
  portfolio:
    image: zeinebkhaled/portfolio-yassine-cloud:${IMAGE_TAG:-latest}
    container_name: portfolio-yassine-cloud
    ports:
      - "3003:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
